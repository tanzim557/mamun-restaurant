# ==============================================================================
# 🛡️ Nginx Production Hardened Configuration for Nazrul Hotel (Laravel + Apps)
# ==============================================================================

# Rate limiting zones to prevent DDoS & brute force
limit_req_zone $binary_remote_addr zone=one:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name nazrulhotel.com www.nazrulhotel.com;
    
    # Enforce HTTPS redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nazrulhotel.com www.nazrulhotel.com;

    root /var/www/mamun-restaurant-laravel/public;
    index index.php index.html;

    # 🔐 SSL Configuration (Let's Encrypt / Cloudflare SSL)
    # ssl_certificate /etc/letsencrypt/live/nazrulhotel.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nazrulhotel.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 🛡️ Production Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 🚀 Gzip Compression for Fast Mobile Load
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        limit_req zone=one burst=25 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 🔒 Strict Rate Limit on Admin Login
    location ~* /api/admin/login|/admin/login {
        limit_req zone=login burst=3 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 🚫 BLOCK script execution inside uploads directory (Anti-Malware / Anti-RCE)
    location ~* ^/uploads/.*\.(php|phps|phtml|sh|py|pl|cgi|exe|bat)$ {
        deny all;
        return 403;
    }

    # 🚫 BLOCK access to all hidden files (.env, .git, .htaccess)
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # PHP FastCGI
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Cache static assets for speed
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
